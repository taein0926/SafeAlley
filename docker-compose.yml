name: safealley

services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safealley}
      POSTGRES_USER: ${POSTGRES_USER:-safealley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safealley-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT PostGIS_Version()'"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - private

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safealley}
      POSTGRES_USER: ${POSTGRES_USER:-safealley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safealley-local-only}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      ROUTE_SNAP_MAX_DISTANCE_M: ${ROUTE_SNAP_MAX_DISTANCE_M:-500}
      SAFE_ROUTE_DISTANCE_WEIGHT: ${SAFE_ROUTE_DISTANCE_WEIGHT:-1.0}
      SAFE_ROUTE_RISK_WEIGHT: ${SAFE_ROUTE_RISK_WEIGHT:-5.0}
      SAFETY_CCTV_WEIGHT: ${SAFETY_CCTV_WEIGHT:-0.40}
      SAFETY_HELP_POINT_WEIGHT: ${SAFETY_HELP_POINT_WEIGHT:-0.20}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_INTENT_CACHE_SECONDS: ${OLLAMA_INTENT_CACHE_SECONDS:-300}
      STT_MODEL: ${STT_MODEL:-small}
      STT_MODEL_DIR: /models/stt
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-SafeAlley-MVP/0.1}
      NOMINATIM_TIMEOUT_SECONDS: ${NOMINATIM_TIMEOUT_SECONDS:-10}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - stt_models:/models/stt
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - public
      - private

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_OSM_TILE_URL: ${VITE_OSM_TILE_URL:-https://tile.openstreetmap.org/}
        VITE_BUILDING_SOURCE: ${VITE_BUILDING_SOURCE:-molit-gis-building}
        VITE_SHOW_STREETLIGHTS: ${VITE_SHOW_STREETLIGHTS:-true}
        VITE_SHOW_CCTVS: ${VITE_SHOW_CCTVS:-true}
        VITE_SHOW_HELP_POINTS: ${VITE_SHOW_HELP_POINTS:-true}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - public

  # Runs in the same safealley project. Batch collection only; no exposed port.
  weather:
    build:
      context: ./data_pipeline
    command: ["weather-worker"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safealley}
      POSTGRES_USER: ${POSTGRES_USER:-safealley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safealley-local-only}
      DB_HOST: database
      DB_PORT: 5432
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      KMA_GRID_NX: ${KMA_GRID_NX:-}
      KMA_GRID_NY: ${KMA_GRID_NY:-}
      KASI_SERVICE_KEY: ${KASI_SERVICE_KEY:-}
      KASI_LOCATION: ${KASI_LOCATION:-인천}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public
      - private

  pipeline:
    profiles: ["tools"]
    build:
      context: ./data_pipeline
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safealley}
      POSTGRES_USER: ${POSTGRES_USER:-safealley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safealley-local-only}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      SAFETY_STREETLIGHT_WEIGHT: ${SAFETY_STREETLIGHT_WEIGHT:-0.40}
      SAFETY_CCTV_WEIGHT: ${SAFETY_CCTV_WEIGHT:-0.40}
      SAFETY_HELP_POINT_WEIGHT: ${SAFETY_HELP_POINT_WEIGHT:-0.20}
      SAFETY_POPULATION_WEIGHT: ${SAFETY_POPULATION_WEIGHT:-0.20}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      DATA_GO_KR_CCTV_API_URL: ${DATA_GO_KR_CCTV_API_URL:-}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY:-}
      KMA_GRID_NX: ${KMA_GRID_NX:-}
      KMA_GRID_NY: ${KMA_GRID_NY:-}
      KASI_SERVICE_KEY: ${KASI_SERVICE_KEY:-}
      KASI_LOCATION: ${KASI_LOCATION:-인천}
      SAFETY_CCTV_PURPOSES: ${SAFETY_CCTV_PURPOSES:-}
      CCTV_SEARCH_RADIUS_M: ${CCTV_SEARCH_RADIUS_M:-30}
      CCTV_SAMPLE_INTERVAL_M: ${CCTV_SAMPLE_INTERVAL_M:-5}
      CCTV_CANDIDATE_SEARCH_RADIUS_M: ${CCTV_CANDIDATE_SEARCH_RADIUS_M:-500}
      CCTV_DISTANCE_WEIGHT: ${CCTV_DISTANCE_WEIGHT:-0.40}
      CCTV_DENSITY_WEIGHT: ${CCTV_DENSITY_WEIGHT:-0.30}
      CCTV_GAP_WEIGHT: ${CCTV_GAP_WEIGHT:-0.30}
      OVERPASS_API_URL: ${OVERPASS_API_URL:-https://overpass-api.de/api/interpreter}
      OVERPASS_TIMEOUT_SECONDS: ${OVERPASS_TIMEOUT_SECONDS:-240}
      OSM_AREA_NAME: ${OSM_AREA_NAME:-미추홀구}
      OSM_AREA_ADMIN_LEVEL: ${OSM_AREA_ADMIN_LEVEL:-6}
      OSM_USER_AGENT: ${OSM_USER_AGENT:-SafeAlley-MVP/0.1}
      OSM_SAFETY_SCORE_MODE: ${OSM_SAFETY_SCORE_MODE:-demo}
      OSM_DEFAULT_SAFETY_SCORE: ${OSM_DEFAULT_SAFETY_SCORE:-50}
      OSM_MIN_SEGMENT_LENGTH_M: ${OSM_MIN_SEGMENT_LENGTH_M:-1}
      STREETLIGHT_SEGMENT_LENGTH_M: ${STREETLIGHT_SEGMENT_LENGTH_M:-20}
      STREETLIGHT_SEARCH_RADIUS_M: ${STREETLIGHT_SEARCH_RADIUS_M:-30}
      STREETLIGHT_SAMPLE_INTERVAL_M: ${STREETLIGHT_SAMPLE_INTERVAL_M:-5}
      STREETLIGHT_CANDIDATE_SEARCH_RADIUS_M: ${STREETLIGHT_CANDIDATE_SEARCH_RADIUS_M:-500}
      STREETLIGHT_DISTANCE_WEIGHT: ${STREETLIGHT_DISTANCE_WEIGHT:-0.40}
      STREETLIGHT_DENSITY_WEIGHT: ${STREETLIGHT_DENSITY_WEIGHT:-0.30}
      STREETLIGHT_GAP_WEIGHT: ${STREETLIGHT_GAP_WEIGHT:-0.30}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public
      - private
    volumes:
      - ./data_pipeline/raw:/pipeline/raw
      - ./data_pipeline/processed:/pipeline/processed

volumes:
  postgis_data:
  stt_models:

networks:
  public:
  private:
    internal: true
