# Use with the repository-root docker-compose.yml, not deployment/compose.yml.
# An approved SSH tunnel must listen on Docker's host gateway port 11435.
services:
  database:
    ports: !reset []
  backend:
    ports: !reset []
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11435
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:26b}
      STT_REMOTE_URL: http://host.docker.internal:11436
  frontend:
    ports: !override
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
